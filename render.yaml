# Render Blueprint for the API. The web app is deployed on Vercel (see README → Deployment).
# Dashboard → New → Blueprint → pick this repo. Render asks for the values marked
# `sync: false` (the API keys) on first deploy; everything else is set here.
# Redeploys automatically on every push to main.

services:
  - type: web
    name: smile-desk-api
    runtime: node
    # Starter, not free: free instances sleep after 15 minutes and have no persistent disk,
    # so the demo database would reset on every wake-up.
    plan: starter
    rootDir: .
    buildCommand: npm ci && npm run build -w @smile-desk/api
    startCommand: npm run start:prod -w @smile-desk/api
    healthCheckPath: /health
    disk:
      name: smile-desk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      # The web app's public URL on Vercel (comma-separate several, e.g. a custom domain too).
      - key: WEB_ORIGIN
        sync: false
      # On the persistent disk, so bookings and staff alerts survive deploys and restarts.
      - key: DB_PATH
        value: /var/data/smile-desk.db
